<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, link previews and the JSON-LD below are written from the "seo"
         block in src/data/cms.json (edited in /admin → SEO) by tools/seo-head.mjs on every build.
         Edit them there: anything typed between the markers is replaced. -->
    <!-- seo:start -->
    <title>Ahtar Maulana Gurning · Solution Engineer &amp; Web Developer</title>
    <!-- seo:end -->
    <meta name="theme-color" content="#070C1A" />

    <!-- icons: Google's results want a square at a multiple of 48px; browsers take the SVG.
         The PNGs and the .ico are drawn from favicon.svg by tools/favicons.mjs -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* the prerendered copy inside #root: out of sight for everyone with JavaScript (React
         replaces it within moments), a plain readable page for browsers without it */
      .prerender {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @media (scripting: none) {
        .prerender {
          position: static;
          width: auto;
          height: auto;
          overflow: visible;
          clip-path: none;
          white-space: normal;
          max-width: 40rem;
          margin: 3rem auto;
          padding: 0 1.5rem 4rem;
          font-family: system-ui, sans-serif;
          line-height: 1.55;
          color: #e9f1f8;
        }
        .prerender a {
          color: #ee6a48;
        }
        .prerender h1 {
          font-size: 2rem;
          line-height: 1.15;
        }
        .prerender h2 {
          margin-top: 2.5rem;
          font-size: 1.4rem;
        }
        .prerender h3 {
          margin-top: 1.25rem;
          font-size: 1.1rem;
        }
        .prerender p {
          margin-top: 0.5rem;
        }
        .prerender ul {
          margin-top: 0.5rem;
          padding-left: 1.25rem;
          list-style: disc;
        }
      }
    </style>
  </head>
  <body>
    <!-- The page's content as plain HTML, written from src/data/cms.json at build by
         tools/seo-head.mjs, for crawlers that read the HTML without running JavaScript.
         React replaces it when it starts; until then it stays visually hidden (no flash before
         the loading screen), and it shows as a simple page only when JavaScript is off. -->
    <div id="root">
      <main class="prerender">
        <!-- seo:static -->
        <h1>Ahtar Maulana Gurning, Solution Engineer</h1>
        <!-- /seo:static -->
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
