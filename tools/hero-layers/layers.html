<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>hero layers</title>
    <!--
      Draws the hero's parallax layers: the mountains around Bogor (Gunung Salak) in the site's
      palette, at one of four times of day: ?phase=dusk (the default), dawn, day or night.
      Seeded, so every run gives the same picture.
      window.exportLayers() returns { sky, far, clouds, wisps, near } as WebP data URLs (all but sky keep alpha),
      plus lighter phone copies: sky-m (sky with the clouds baked in), far-m and near-m.
      generate.mjs calls it and writes public/hero-layers/*.webp. Open this file to preview.
    -->
    <style>
      body { margin: 0; background: #000; }
      canvas { display: block; width: 100%; height: auto; }
      #preview { position: relative; }
      #preview canvas { position: absolute; inset: 0; }
      #preview canvas:first-child { position: relative; }
    </style>
  </head>
  <body>
    <div id="preview"></div>
    <script>
      const W = 2400
      const H = 1600
      const C = {
        ground: '#070c1a',
        deep: '#0d1830',
        navy: '#15223f',
        raised: '#1f2e4f',
        sky: '#cfe2f1',
        soft: '#e9f1f8',
        mist: '#a9b6cc',
        coral: '#ee6a48',
        coralDeep: '#c8502f',
      }

      // ---------- the light, per time of day. dusk is the original picture, value for value.
      const PHASES = {
        dusk: {
          sun: { x: 0.36, y: 0.6 },
          sky: [[0, '#060b18'], [0.3, '#0d1830'], [0.5, '#1f2e4f'], [0.6, '#5a3a4a'], [0.68, '#b5543a'], [0.75, '#c8502f'], [1, '#2a1a24']],
          glow: '238,106,72', glowA: [0.75, 0.3], glowR: 0.55,
          disc: { r: 150, stops: [[0, 'rgba(255,214,190,1)'], [0.55, 'rgba(250,150,110,0.95)'], [0.75, 'rgba(238,106,72,0.5)'], [1, 'rgba(238,106,72,0)']] },
          streakWarm: '238,120,90', streakCold: '207,226,241', streakA: [0.08, 0.1, 0.04, 0.06],
          stars: 260, starDepth: 0.42, starA: 1,
          far1: [[0, 'rgba(120,96,120,0.75)'], [0.4, 'rgba(70,70,100,0.9)'], [1, 'rgba(40,46,74,1)']],
          mistWarm: 'rgb(238,140,110)', mistWarmA: 0.25,
          salak: [[0, 'rgba(84,102,140,1)'], [0.35, 'rgba(46,62,98,1)'], [1, 'rgba(24,36,64,1)']],
          rim: '238,140,110', rimA: [0.45, 0.3],
          far2: [[0, 'rgba(40,56,92,1)'], [1, 'rgba(18,28,52,1)']],
          mistCool: 'rgb(169,182,204)', mistCoolA: [0.22, 0.12],
          nearMid: '#111c36', near: '#0a1226', rimNear: 'rgba(238,106,72,0.35)',
          cloudSun: [1.0, 0.52, 0.3, 9.0], cloudTop: [0.07, 0.1, 0.22], cloudLow: [0.3, 0.16, 0.2],
          wispCool: [150, 140, 170], wispWarm: [244, 168, 132],
        },
        // first light from the east (the right): pink and gold, the last stars going
        dawn: {
          sun: { x: 0.74, y: 0.62 },
          sky: [[0, '#0a1430'], [0.3, '#1c2b55'], [0.5, '#475284'], [0.6, '#8c6f96'], [0.68, '#e0a08f'], [0.75, '#f3c09a'], [1, '#3b2c3e']],
          glow: '247,178,150', glowA: [0.7, 0.28], glowR: 0.5,
          disc: { r: 120, stops: [[0, 'rgba(255,240,220,1)'], [0.55, 'rgba(255,205,170,0.95)'], [0.75, 'rgba(247,178,150,0.5)'], [1, 'rgba(247,178,150,0)']] },
          streakWarm: '250,190,165', streakCold: '207,226,241', streakA: [0.1, 0.12, 0.05, 0.06],
          stars: 110, starDepth: 0.3, starA: 0.55,
          far1: [[0, 'rgba(150,130,165,0.75)'], [0.4, 'rgba(96,98,138,0.9)'], [1, 'rgba(52,60,96,1)']],
          mistWarm: 'rgb(250,190,165)', mistWarmA: 0.3,
          salak: [[0, 'rgba(98,116,160,1)'], [0.35, 'rgba(56,74,114,1)'], [1, 'rgba(28,40,70,1)']],
          rim: '250,190,165', rimA: [0.45, 0.3],
          far2: [[0, 'rgba(46,62,100,1)'], [1, 'rgba(20,30,56,1)']],
          mistCool: 'rgb(196,200,226)', mistCoolA: [0.26, 0.14],
          nearMid: '#121e3a', near: '#0a1226', rimNear: 'rgba(247,178,150,0.3)',
          cloudSun: [1.0, 0.72, 0.58, 8.0], cloudTop: [0.14, 0.16, 0.3], cloudLow: [0.42, 0.3, 0.38],
          wispCool: [170, 166, 196], wispWarm: [252, 206, 182],
        },
        // a clear tropical afternoon: the sun high and white, the far ranges blue with distance
        day: {
          sun: { x: 0.7, y: 0.16 },
          sky: [[0, '#0f2b5c'], [0.3, '#1d4a88'], [0.5, '#3a74b4'], [0.6, '#6a9fd0'], [0.68, '#a6c9e6'], [0.75, '#c7def0'], [1, '#5c7896']],
          glow: '255,250,235', glowA: [0.55, 0.12], glowR: 0.35,
          disc: { r: 80, stops: [[0, 'rgba(255,255,250,1)'], [0.55, 'rgba(255,250,232,0.95)'], [0.75, 'rgba(255,246,220,0.45)'], [1, 'rgba(255,246,220,0)']] },
          streakWarm: '255,255,255', streakCold: '255,255,255', streakA: [0.05, 0.06, 0.05, 0.06],
          stars: 0, starDepth: 0.42, starA: 0,
          far1: [[0, 'rgba(140,172,212,0.8)'], [0.4, 'rgba(104,138,184,0.92)'], [1, 'rgba(70,98,140,1)']],
          mistWarm: 'rgb(220,234,246)', mistWarmA: 0.3,
          salak: [[0, 'rgba(92,124,170,1)'], [0.35, 'rgba(56,82,124,1)'], [1, 'rgba(30,46,80,1)']],
          rim: '233,241,248', rimA: [0.3, 0.2],
          far2: [[0, 'rgba(44,66,104,1)'], [1, 'rgba(20,32,58,1)']],
          mistCool: 'rgb(207,226,241)', mistCoolA: [0.3, 0.16],
          nearMid: '#13213f', near: '#0b1429', rimNear: 'rgba(233,241,248,0.18)',
          cloudSun: [1.0, 0.98, 0.94, 7.0], cloudTop: [0.42, 0.56, 0.78], cloudLow: [0.58, 0.68, 0.82],
          wispCool: [200, 216, 236], wispWarm: [236, 242, 250],
        },
        // a clear night: the moon high in the east, the sky full of stars, everything silver
        night: {
          sun: { x: 0.72, y: 0.2 },
          sky: [[0, '#03060f'], [0.3, '#060c1c'], [0.5, '#0c1730'], [0.6, '#132144'], [0.68, '#1a2a52'], [0.75, '#1e2f5a'], [1, '#090e1e']],
          glow: '207,226,241', glowA: [0.22, 0.06], glowR: 0.3,
          disc: { r: 46, stops: [[0, 'rgba(240,246,252,1)'], [0.7, 'rgba(226,236,248,1)'], [0.85, 'rgba(207,226,241,0.35)'], [1, 'rgba(207,226,241,0)']] },
          streakWarm: '169,182,204', streakCold: '169,182,204', streakA: [0.03, 0.05, 0.03, 0.05],
          stars: 900, starDepth: 0.62, starA: 1.15,
          far1: [[0, 'rgba(60,72,104,0.75)'], [0.4, 'rgba(36,46,76,0.9)'], [1, 'rgba(22,30,54,1)']],
          mistWarm: 'rgb(120,140,180)', mistWarmA: 0.14,
          salak: [[0, 'rgba(46,60,92,1)'], [0.35, 'rgba(28,40,68,1)'], [1, 'rgba(16,24,44,1)']],
          rim: '169,182,204', rimA: [0.32, 0.2],
          far2: [[0, 'rgba(24,36,62,1)'], [1, 'rgba(12,20,38,1)']],
          mistCool: 'rgb(120,140,180)', mistCoolA: [0.16, 0.08],
          nearMid: '#0c152b', near: '#070d1d', rimNear: 'rgba(169,182,204,0.18)',
          cloudSun: [0.62, 0.72, 0.92, 2.4], cloudTop: [0.02, 0.03, 0.07], cloudLow: [0.05, 0.07, 0.14],
          wispCool: [64, 76, 108], wispWarm: [150, 166, 200],
        },
      }
      const asked = new URLSearchParams(location.search).get('phase')
      const PHASE = asked in PHASES ? asked : 'dusk'
      const PH = PHASES[PHASE]

      // seeded random
      const rng = (seed) => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646

      // 1D ridge: midpoint displacement, a few smoothing passes, plus named peaks
      function ridge({ seed, base, rough, amp, peaks = [], n = 1024, smooth = 2 }) {
        const r = rng(seed)
        const y = new Float32Array(n + 1)
        y[0] = (r() - 0.5) * amp
        y[n] = (r() - 0.5) * amp
        for (let step = n; step > 1; step /= 2) {
          const s = (step / n) * amp
          for (let i = step / 2; i < n; i += step) {
            y[i] = (y[i - step / 2] + y[i + step / 2]) / 2 + (r() - 0.5) * s * rough
          }
        }
        for (let k = 0; k < smooth; k++) for (let i = 1; i < n; i++) y[i] = (y[i - 1] + y[i] * 2 + y[i + 1]) / 4
        return (x) => {
          const t = Math.max(0, Math.min(1, x / W)) * n
          const i = Math.floor(t)
          const f = t - i
          let v = base + (y[i] * (1 - f) + y[Math.min(n, i + 1)] * f)
          for (const p of peaks) {
            const d = Math.abs(x - p.x) / p.w
            v -= p.h * Math.exp(-Math.pow(d, p.k || 1.35))
          }
          return v
        }
      }

      function fillRidge(ctx, f, fill) {
        ctx.beginPath()
        ctx.moveTo(0, H)
        for (let x = 0; x <= W; x += 3) ctx.lineTo(x, f(x))
        ctx.lineTo(W, H)
        ctx.closePath()
        ctx.fillStyle = fill
        ctx.fill()
      }

      function strokeRidge(ctx, f, style, width) {
        ctx.beginPath()
        for (let x = 0; x <= W; x += 3) x === 0 ? ctx.moveTo(x, f(x)) : ctx.lineTo(x, f(x))
        ctx.strokeStyle = style
        ctx.lineWidth = width
        ctx.stroke()
      }

      function vgrad(ctx, y0, y1, stops) {
        const g = ctx.createLinearGradient(0, y0, 0, y1)
        stops.forEach(([o, c]) => g.addColorStop(o, c))
        return g
      }

      // a band of mist that sits on the foot of a ridge
      function mist(ctx, y, h, color, alpha) {
        const g = ctx.createLinearGradient(0, y - h, 0, y + h)
        g.addColorStop(0, 'rgba(0,0,0,0)')
        g.addColorStop(0.5, color.replace(')', `, ${alpha})`).replace('rgb', 'rgba'))
        g.addColorStop(1, 'rgba(0,0,0,0)')
        ctx.fillStyle = g
        ctx.fillRect(0, y - h, W, h * 2)
      }

      function canvas() {
        const c = document.createElement('canvas')
        c.width = W
        c.height = H
        return c
      }

      // the sun (the moon at night): low behind the range at dusk and dawn, high by day and night
      const SUN = { x: W * PH.sun.x, y: H * PH.sun.y }

      // ---------- 1. sky (opaque)
      function drawSky() {
        const c = canvas()
        const ctx = c.getContext('2d')
        ctx.fillStyle = vgrad(ctx, 0, H, PH.sky)
        ctx.fillRect(0, 0, W, H)

        // light pooling around the sun
        let g = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, W * PH.glowR)
        g.addColorStop(0, `rgba(${PH.glow},${PH.glowA[0]})`)
        g.addColorStop(0.25, `rgba(${PH.glow},${PH.glowA[1]})`)
        g.addColorStop(1, `rgba(${PH.glow},0)`)
        ctx.fillStyle = g
        ctx.fillRect(0, 0, W, H)

        // the sun disc, soft edged
        g = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, PH.disc.r)
        for (const [at, color] of PH.disc.stops) g.addColorStop(at, color)
        ctx.fillStyle = g
        ctx.beginPath()
        ctx.arc(SUN.x, SUN.y, PH.disc.r, 0, Math.PI * 2)
        ctx.fill()

        // thin cloud streaks lit from below
        const r = rng(11)
        for (let i = 0; i < 9; i++) {
          const y = H * (0.36 + r() * 0.24)
          const x = r() * W
          const w = 300 + r() * 700
          const warm = y > H * 0.48
          ctx.fillStyle = warm ? `rgba(${PH.streakWarm},${PH.streakA[0] + r() * PH.streakA[1]})` : `rgba(${PH.streakCold},${PH.streakA[2] + r() * PH.streakA[3]})`
          ctx.beginPath()
          ctx.ellipse(x, y, w, 3 + r() * 6, 0, 0, Math.PI * 2)
          ctx.fill()
        }

        // stars in the cold top of the sky
        for (let i = 0; i < PH.stars; i++) {
          const y = Math.pow(r(), 1.8) * H * PH.starDepth
          const a = Math.min(1, (1 - y / (H * PH.starDepth)) * (0.25 + r() * 0.6) * PH.starA)
          ctx.fillStyle = `rgba(233,241,248,${a})`
          ctx.beginPath()
          ctx.arc(r() * W, y, 0.6 + r() * 1.6, 0, Math.PI * 2)
          ctx.fill()
        }
        return c
      }

      // ---------- 2. far range: Gunung Salak and its neighbours, in haze (alpha)
      function drawFar() {
        const c = canvas()
        const ctx = c.getContext('2d')

        // farthest line of hills, nearly the colour of the sky
        const f1 = ridge({ seed: 21, base: H * 0.63, rough: 0.9, amp: 120, smooth: 3 })
        fillRidge(ctx, f1, vgrad(ctx, H * 0.55, H, PH.far1))
        mist(ctx, H * 0.7, 60, PH.mistWarm, PH.mistWarmA)

        // Gunung Salak: a broad massif with a crown of jagged peaks
        const salak = ridge({
          seed: 7,
          base: H * 0.74,
          rough: 1.7,
          amp: 170,
          smooth: 0,
          peaks: [
            { x: W * 0.6, w: W * 0.17, h: H * 0.19, k: 1.15 },
            { x: W * 0.555, w: W * 0.03, h: H * 0.06, k: 1 },
            { x: W * 0.635, w: W * 0.025, h: H * 0.07, k: 1 },
            { x: W * 0.7, w: W * 0.035, h: H * 0.04, k: 1 },
            { x: W * 0.5, w: W * 0.04, h: H * 0.025, k: 1 },
          ],
        })
        fillRidge(ctx, salak, vgrad(ctx, H * 0.48, H, PH.salak))
        // the light catching the edges
        strokeRidge(ctx, salak, `rgba(${PH.rim},${PH.rimA[0]})`, 2)

        // a second range on the left, Pangrango-like, a step nearer
        const f2 = ridge({
          seed: 33,
          base: H * 0.8,
          rough: 1.45,
          amp: 150,
          smooth: 1,
          peaks: [{ x: W * 0.14, w: W * 0.16, h: H * 0.15 }],
        })
        fillRidge(ctx, f2, vgrad(ctx, H * 0.6, H, PH.far2))
        strokeRidge(ctx, f2, `rgba(${PH.rim},${PH.rimA[1]})`, 2)
        mist(ctx, H * 0.84, 70, PH.mistCool, PH.mistCoolA[0])
        return c
      }

      // ---------- 4. near hills with pines (alpha, opaque at the foot)
      function drawNear() {
        const c = canvas()
        const ctx = c.getContext('2d')

        const mid = ridge({ seed: 51, base: H * 0.83, rough: 1.0, amp: 120, smooth: 2, peaks: [{ x: W * 0.85, w: W * 0.12, h: H * 0.07 }] })
        fillRidge(ctx, mid, PH.nearMid)
        strokeRidge(ctx, mid, PH.rimNear, 2)
        mist(ctx, H * 0.9, 50, PH.mistCool, PH.mistCoolA[1])

        const near = ridge({ seed: 64, base: H * 0.91, rough: 0.8, amp: 90, smooth: 3, peaks: [{ x: W * 0.12, w: W * 0.18, h: H * 0.06 }] })
        fillRidge(ctx, near, PH.near)

        // pines along the near ridge
        const r = rng(77)
        const tree = (x, baseY, h, color) => {
          const w = h * 0.34
          ctx.fillStyle = color
          ctx.beginPath()
          const tiers = 5
          for (let t = 0; t < tiers; t++) {
            const ty = baseY - (h * t) / tiers
            const tw = w * (1 - t / (tiers + 1))
            ctx.moveTo(x - tw, ty)
            ctx.lineTo(x, ty - (h / tiers) * 1.9)
            ctx.lineTo(x + tw, ty)
          }
          ctx.fill()
          ctx.fillRect(x - 3, baseY - 4, 6, 14)
        }
        for (let x = 0; x < W; x += 18 + r() * 34) {
          if (r() < 0.35) continue
          const h = 40 + r() * 120
          tree(x, mid(x) + 6, h * 0.7, PH.nearMid)
        }
        for (let x = 0; x < W; x += 14 + r() * 26) {
          if (r() < 0.2) continue
          const h = 60 + r() * 160
          tree(x, near(x) + 8, h, PH.near)
        }

        // fade the foot into the page ground so the hero hands over cleanly
        ctx.fillStyle = vgrad(ctx, H * 0.88, H, [[0, 'rgba(7,12,26,0)'], [1, 'rgba(7,12,26,1)']])
        ctx.fillRect(0, H * 0.88, W, H * 0.12)
        return c
      }

      // ---------- 3. clouds: soft value-noise fields shaped into banks, lit from the low sun below them
      function makeNoise(seed) {
        const r = rng(seed)
        const p = [...Array(256).keys()]
        for (let i = 255; i > 0; i--) {
          const j = Math.floor(r() * (i + 1))
          ;[p[i], p[j]] = [p[j], p[i]]
        }
        const P = new Uint16Array(512)
        for (let i = 0; i < 512; i++) P[i] = p[i & 255]
        const V = new Float32Array(256).map(() => r())
        const fade = (t) => t * t * (3 - 2 * t)
        const at = (x, y) => V[P[P[x & 255] + (y & 255)]]
        return (x, y) => {
          const xi = Math.floor(x)
          const yi = Math.floor(y)
          const u = fade(x - xi)
          const v = fade(y - yi)
          const a = at(xi, yi)
          const b = at(xi + 1, yi)
          const c = at(xi, yi + 1)
          const d = at(xi + 1, yi + 1)
          return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v
        }
      }
      const fbm = (noise, x, y, octaves = 5) => {
        let sum = 0
        let amp = 0.5
        let f = 1
        let norm = 0
        for (let o = 0; o < octaves; o++) {
          sum += noise(x * f, y * f) * amp
          norm += amp
          amp *= 0.5
          f *= 2.03
        }
        return sum / norm
      }
      const smooth = (a, b, x) => {
        const t = Math.max(0, Math.min(1, (x - a) / (b - a)))
        return t * t * (3 - 2 * t)
      }
      const mix = (c1, c2, t) => c1.map((v, i) => v + (c2[i] - v) * t)

      /**
       * Clouds, rendered as a real volume: a deck of cloud between 1.2 and 2.2 km up, seen from
       * the ground through a 75° lens, so it recedes in perspective to the horizon. Each pixel
       * marches through the deck; at every step it measures how much cloud lies between that point
       * and the low sun (Beer–Lambert) and how strongly vapour scatters light toward the eye
       * (Henyey–Greenstein, forward-heavy, so the cloud near the sun glows). Undersides catch the
       * warm sunset, tops sink into the evening blue. Rendered on the GPU (WebGL) at half size.
       */
      function drawClouds() {
        const w = W / 2
        const h = H / 2
        const glc = document.createElement('canvas')
        glc.width = w
        glc.height = h
        const gl = glc.getContext('webgl', { premultipliedAlpha: true, preserveDrawingBuffer: true, alpha: true })
        const vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }'
        const fs = `
          precision highp float;
          uniform vec2 res;
          uniform vec2 sunPx;
          uniform float horizon;
          uniform vec4 sunLight; // colour and strength of the sun (or moon)
          uniform vec3 skyTop;
          uniform vec3 skyLow;
          float hash(vec3 p) {
            p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419));
            p *= 17.0;
            return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
          }
          float noise(vec3 x) {
            vec3 i = floor(x);
            vec3 f = fract(x);
            f = f * f * (3.0 - 2.0 * f);
            return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
                       mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
          }
          float fbm(vec3 p) {
            float a = 0.5, s = 0.0;
            for (int i = 0; i < 5; i++) { s += a * noise(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; }
            return s;
          }
          const float BASE = 1.2;
          const float TOP = 2.2;
          float density(vec3 p) {
            float hgt = (p.y - BASE) / (TOP - BASE);
            if (hgt < 0.0 || hgt > 1.0) return 0.0;
            // flat-ish bases, rounded, thinning tops
            float profile = smoothstep(0.0, 0.12, hgt) * smoothstep(1.0, 0.45, hgt);
            vec3 q = p * vec3(0.32, 0.9, 0.32) + vec3(3.0, 0.0, 1.0);
            float shape = fbm(q);
            // big gaps between the cloud fields, so stars and sky show through
            float fields = smoothstep(0.38, 0.62, fbm(p * vec3(0.07, 0.0, 0.07) + vec3(11.0, 0.0, 5.0)));
            float d = (shape * fields - 0.36) * 3.2;
            // wispy, eroded edges
            d -= (1.0 - smoothstep(0.0, 0.5, d)) * (fbm(p * 1.6 + vec3(5.0)) - 0.5) * 0.9;
            return clamp(d, 0.0, 1.0) * profile;
          }
          float hg(float c, float g) { float g2 = g * g; return (1.0 - g2) / (12.566 * pow(1.0 + g2 - 2.0 * g * c, 1.5)); }
          void main() {
            vec2 px = vec2(gl_FragCoord.x, res.y - gl_FragCoord.y) * (2400.0 / res.x); // full-size picture pixels, y down
            float focal = 1200.0 / tan(radians(37.5));
            vec3 dir = normalize(vec3((px.x - 1200.0) / focal, (horizon - px.y) / focal, 1.0));
            vec3 sun = normalize(vec3((sunPx.x - 1200.0) / focal, (horizon - sunPx.y) / focal, 1.0));
            if (dir.y < 0.004) { gl_FragColor = vec4(0.0); return; }
            float t0 = BASE / dir.y;
            float t1 = min(TOP / dir.y, 90.0);
            if (t0 > 90.0) { gl_FragColor = vec4(0.0); return; }
            const int STEPS = 120;
            float dt = (t1 - t0) / float(STEPS);
            float cosA = dot(dir, sun);
            float phase = mix(hg(cosA, -0.15), hg(cosA, 0.75), 0.55);
            vec3 sunCol = sunLight.rgb * sunLight.a;
            vec3 col = vec3(0.0);
            float T = 1.0;
            float jitter = 0.5 + (hash(vec3(px, 1.0)) - 0.5) * 0.35; // a little dither, no visible grain
            for (int i = 0; i < STEPS; i++) {
              float t = t0 + (float(i) + jitter) * dt;
              vec3 p = dir * t;
              float d = density(p);
              if (d > 0.002) {
                // light reaching this point from the sun, through the cloud above/before it
                float dl = 0.0;
                for (int j = 1; j <= 6; j++) dl += density(p + sun * (0.07 * float(j * j)));
                float beer = exp(-dl * 1.6);
                float powder = 1.0 - exp(-d * 4.0);
                float hgt = (p.y - BASE) / (TOP - BASE);
                vec3 ambient = mix(skyLow, skyTop, hgt);
                vec3 light = sunCol * beer * powder * phase + ambient;
                float a = 1.0 - exp(-d * dt * 1.9);
                // far cloud fades into the haze at the horizon
                a *= exp(-t * 0.018);
                col += T * a * light;
                T *= 1.0 - a;
                if (T < 0.02) break;
              }
            }
            float alpha = 1.0 - T;
            vec3 c = alpha > 0.001 ? col / alpha : vec3(0.0);
            c = 1.0 - exp(-c * 1.15); // soft tone curve
            c = pow(c, vec3(0.85));
            gl_FragColor = vec4(c * alpha, alpha);
          }
        `
        const compile = (type, src) => {
          const s = gl.createShader(type)
          gl.shaderSource(s, src)
          gl.compileShader(s)
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s))
          return s
        }
        const prog = gl.createProgram()
        gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs))
        gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs))
        gl.linkProgram(prog)
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog))
        gl.useProgram(prog)
        const buf = gl.createBuffer()
        gl.bindBuffer(gl.ARRAY_BUFFER, buf)
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
        const loc = gl.getAttribLocation(prog, 'p')
        gl.enableVertexAttribArray(loc)
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)
        gl.uniform2f(gl.getUniformLocation(prog, 'res'), w, h)
        gl.uniform2f(gl.getUniformLocation(prog, 'sunPx'), SUN.x, SUN.y)
        gl.uniform1f(gl.getUniformLocation(prog, 'horizon'), H * 0.64)
        gl.uniform4f(gl.getUniformLocation(prog, 'sunLight'), ...PH.cloudSun)
        gl.uniform3f(gl.getUniformLocation(prog, 'skyTop'), ...PH.cloudTop)
        gl.uniform3f(gl.getUniformLocation(prog, 'skyLow'), ...PH.cloudLow)
        gl.viewport(0, 0, w, h)
        gl.clearColor(0, 0, 0, 0)
        gl.clear(gl.COLOR_BUFFER_BIT)
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)

        const c = canvas()
        const ctx = c.getContext('2d')
        ctx.imageSmoothingQuality = 'high'
        ctx.drawImage(glc, 0, 0, W, H)
        return c
      }

      // a low, thin band of mist in front of the far range: the camera passes through it on scroll
      function drawWisps() {
        const c = canvas()
        const ctx = c.getContext('2d')
        const L = 2
        const w = W / L
        const h = H / L
        const noise = makeNoise(123)
        const out = new ImageData(w, h)
        for (let j = 0; j < h; j++) {
          const y = j * L
          const band = Math.exp(-Math.pow((y - H * 0.765) / (H * 0.035), 2))
          if (band < 0.01) continue
          for (let i = 0; i < w; i++) {
            const x = i * L
            const n = fbm(noise, x / 520, y / 70, 5)
            const d = smooth(0.42, 0.75, n) * band
            if (d <= 0.002) continue
            const near = Math.exp(-Math.abs(x - SUN.x) / (W * 0.3))
            const col = mix(PH.wispCool, PH.wispWarm, near * 0.8)
            const k = (j * w + i) * 4
            out.data[k] = col[0]
            out.data[k + 1] = col[1]
            out.data[k + 2] = col[2]
            out.data[k + 3] = d * 150
          }
        }
        const small = document.createElement('canvas')
        small.width = w
        small.height = h
        small.getContext('2d').putImageData(out, 0, 0)
        ctx.imageSmoothingQuality = 'high'
        ctx.drawImage(small, 0, 0, W, H)
        return c
      }

      const layers = { sky: drawSky(), clouds: drawClouds(), far: drawFar(), wisps: drawWisps(), near: drawNear() }
      const preview = document.getElementById('preview')
      Object.values(layers).forEach((c) => preview.appendChild(c))

      // half-size layers keep the same 3:2 frame, so they line up the same; it keeps the files small
      const half = (c) => {
        const h = document.createElement('canvas')
        h.width = W / 2
        h.height = H / 2
        const ctx = h.getContext('2d')
        ctx.imageSmoothingQuality = 'high'
        ctx.drawImage(c, 0, 0, W / 2, H / 2)
        return h
      }
      // phones get lighter copies: smaller files, and the clouds baked into the sky (one layer fewer to move)
      const scaled = (c, w) => {
        const out = document.createElement('canvas')
        out.width = w
        out.height = Math.round((w * H) / W)
        const ctx = out.getContext('2d')
        ctx.imageSmoothingQuality = 'high'
        ctx.drawImage(c, 0, 0, out.width, out.height)
        return out
      }
      const skyWithClouds = () => {
        const c = canvas()
        const ctx = c.getContext('2d')
        ctx.drawImage(layers.sky, 0, 0)
        ctx.drawImage(layers.clouds, 0, 0)
        return c
      }
      window.exportLayers = () => ({
        ...Object.fromEntries(
          Object.entries(layers).map(([k, c]) => {
            // clouds are rendered at half size anyway, and the mist is soft: both save at half size
            if (k === 'wisps' || k === 'clouds') return [k, half(c).toDataURL('image/webp', 0.8)]
            return [k, c.toDataURL('image/webp', k === 'sky' ? 0.82 : 0.86)]
          }),
        ),
        'sky-m': scaled(skyWithClouds(), 1200).toDataURL('image/webp', 0.82),
        'far-m': scaled(layers.far, 1600).toDataURL('image/webp', 0.86),
        'near-m': scaled(layers.near, 1600).toDataURL('image/webp', 0.86),
      })
    </script>
  </body>
</html>
